<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Karin</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fec3a6 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
    }
    .card {
        background: white;
        border-radius: 25px;
        padding: 45px 35px;
        max-width: 520px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        animation: fadeIn 1s ease;
        position: relative;
        z-index: 2;
    }
    h1 {
        color: #e91e63;
        font-size: 1.8em;
        margin-bottom: 20px;
    }
    .message {
        color: #444;
        font-size: 17px;
        line-height: 1.9;
        margin-bottom: 25px;
    }
    .emoji {
        font-size: 45px;
        margin-bottom: 15px;
        animation: bounce 2s infinite;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .hearts {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }
    .heart {
        position: absolute;
        color: rgba(255, 255, 255, 0.7);
        animation: float 6s infinite ease-in;
        font-size: 20px;
    }
    @keyframes float {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>

<div class="card">
    <div class="emoji">🌅👑</div>
    <h1>Hai My Princess Karin</h1>
    <div class="message">
        udh pagi bangun jangan bobo terus, 
        kalo udh bangun jangan lupa mandi sarapan 
        sama kabarin i ya, 
        
        oya kenapa i kirim nya malam karna pasti pas u bangun 
        i masih tidur jadi i kirim nya malam aja
    </div>
</div>

<script>
// Animasi hati jatuh
function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '♡';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = Math.random() * 3 + 3 + 's';
    document.getElementById('hearts').appendChild(heart);
    
    setTimeout(() => {
        heart.remove();
    }, 6000);
}
setInterval(createHeart, 400);
</script>
</body>
</html>
